<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Placeholder: naturalne zdjęcie Michała">
  <title>[IMAGE: Michał — praca / rozmowa / zespół / wystąpienie, kadr szeroki 16:7, naturalny nie formalny portret]</title>
  <defs>
    <pattern id="dots-break" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#17B8A6" opacity="0.16" />
    </pattern>
    <radialGradient id="wash-break" cx="20%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#17B8A6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#161B19" stop-opacity="0" />
    </radialGradient>
    <!-- Tonalny overlay u dołu — nawiązanie do photo treatmentu z postów
         LinkedIn Michała (naturalne zdjęcie przechodzące w dark green/
         turquoise u dołu kadru). Docelowe zdjęcie ma dostać ten sam
         gradient nałożony na dole. -->
    <linearGradient id="tonal-break" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#014739" stop-opacity="0" />
      <stop offset="100%" stop-color="#014739" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="#161B19" />
  <rect width="1600" height="700" fill="url(#dots-break)" />
  <rect width="1600" height="700" fill="url(#wash-break)" />
  <rect x="24" y="24" width="1552" height="652" fill="none" stroke="#17B8A6" stroke-width="2" stroke-dasharray="10 8" opacity="0.6" />

  <g transform="translate(800,320)" stroke="#17B8A6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-56" y="-42" width="112" height="84" />
    <circle cx="-28" cy="-18" r="9" fill="#17B8A6" stroke="none" />
    <polyline points="-56,30 -14,-4 18,20 56,-18" />
  </g>

  <text x="800" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#17B8A6">ZDJĘCIE DO DOSTARCZENIA</text>

  <text x="800" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#F7F6F2">
    <tspan x="800" dy="0">Naturalne zdjęcie Michała — praca / rozmowa / zespół / wystąpienie,</tspan>
    <tspan x="800" dy="28">kadr szeroki (nie formalny portret). Docelowo: subtelny dark</tspan>
    <tspan x="800" dy="28">green/turquoise overlay u dołu (patrz posty LinkedIn)</tspan>
  </text>

  <rect width="1600" height="700" fill="url(#tonal-break)" />
</svg>
