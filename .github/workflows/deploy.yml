# Auto-deploy na hosting OVH (michalwilkosz.eu) po każdym scaleniu do main, przez SFTP (port 22).
# Dane logowania tylko w GitHub Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   (z OVH: Hosting → FTP – SSH)
#   FTP_SERVER_DIR                           (opcjonalnie, domyślnie "www")
# Uruchomienie ręczne: Actions → Deploy na michalwilkosz.eu → Run workflow.
#
# Bezpieczeństwo:
# - Nic nie jest usuwane na serwerze (brak --delete), więc /home/.../config (smtp.php,
#   mailerlite.php) i pliki spoza repo zostają nietknięte.
# - Hasła i konfiguracja SMTP/MailerLite NIE są w repo i NIE są wysyłane tym workflow.
name: Deploy na michalwilkosz.eu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Sprawdź, czy sekrety są ustawione
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak sekretów FTP_SERVER / FTP_USERNAME / FTP_PASSWORD — deploy pominięty. Dodaj je w Settings → Secrets and variables → Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pobierz kod (z historią, żeby znać daty zmian plików)
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zainstaluj lftp i ustaw daty plików według ostatniego commita
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp git-restore-mtime
          git restore-mtime

      - name: Wyślij stronę przez SFTP (tylko zmienione pliki, bez usuwania)
        if: steps.secrets.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'www' }}
        run: |
          # Na serwer idzie tylko publiczna strona; pliki repozytorium (README, .github, .gitignore) zostają w repo.
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" sftp://$FTP_SERVER;
            mirror --reverse --only-newer --parallel=4 --verbose \
              -x '^\.git' -x '^\.github/' -x '^\.claude/' -x '^node_modules/' \
              -x '\.md$' -x '^package(-lock)?\.json$' -x '^\.env' -x '^\.gitignore$' \
              ./ \"$FTP_SERVER_DIR\"
          "
